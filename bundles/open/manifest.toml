schema = "openworld.bundle.v1"
id = "open"
name = "Open"
version = "0.1.0"
official = true
best_for = "A computer, with weights measured on public photos."
# At or just above the LFW all-pairs score with a false match rate of one in
# a hundred thousand, measured with eval/real_faces.py. See eval/curves/open.json.
threshold = 0.51
estimate_factor = 1.0
curve = "../../eval/curves/open.json"

[models]
detector = "YuNet"
detector_version = "2023mar"
embedder = "SFace"
embedder_version = "2021dec"
plate = "None"
plate_version = "none"
plate_license = "This bundle has no plate model. A plate is not read."

# The weights are not in the tree. scripts/fetch_weights.py downloads each
# file from its url and keeps it only when the SHA-256 matches this pin.
[[files]]
role = "detector"
name = "YuNet"
version = "2023mar"
sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
license = "MIT. OpenCV Zoo face_detection_yunet, Copyright (c) 2020 Shiqi Yu."
url = "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
path = "weights/face_detection_yunet_2023mar.onnx"

[[files]]
role = "embedder"
name = "SFace"
version = "2021dec"
sha256 = "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
license = "Apache-2.0. OpenCV Zoo face_recognition_sface."
url = "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx"
path = "weights/face_recognition_sface_2021dec.onnx"
