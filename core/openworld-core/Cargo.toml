[package]
name = "openworld-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "On-device photo and video scan for OpenWorld"
publish = false

[lib]
name = "openworld_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "webp"] }
tiff = "0.9.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
sha2 = "0.10.8"
thiserror = "1.0.69"
toml = "0.8.23"
# ONNX Runtime is loaded at run time from a pinned library (scripts/fetch_ort.py).
# Nothing is downloaded while building. api-24 keeps the DirectML runtime usable.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "api-24"] }
ndarray = "0.17"
tempfile = "3.14.0"

[features]
default = ["fixture", "ort-dynamic"]
# Synthetic fiducial markers for demos and tests. An official release build leaves it out
# and refuses a fixture poster pack.
fixture = []
# Raw scores in results, for eval/ only. Never in a shipped build.
eval = []
ort-dynamic = ["ort/load-dynamic"]
coreml = ["ort/coreml"]
nnapi = ["ort/nnapi"]
directml = ["ort/directml"]
cuda = ["ort/cuda"]

[dev-dependencies]

[build-dependencies]
sha2 = "0.10.8"
