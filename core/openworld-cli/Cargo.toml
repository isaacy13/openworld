[package]
name = "openworld-cli"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Laptop CLI for the OpenWorld scan library"
publish = false

[[bin]]
name = "openworld"
path = "src/main.rs"

[features]
default = ["fixture", "network"]
fixture = ["openworld-core/fixture"]
network = ["openworld-core/network"]
eval = ["openworld-core/eval"]

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
openworld-core = { path = "../openworld-core", default-features = false, features = ["ort-dynamic"] }
serde_json = "1.0.134"
tempfile = "3.14.0"

[dev-dependencies]
tempfile = "3.14.0"
