[package]
name = "openworld-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Laptop CLI for the OpenWorld scan library"
publish = false

[[bin]]
name = "openworld"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
openworld-core = { path = "../openworld-core" }
serde_json = "1.0.134"

[dev-dependencies]
tempfile = "3.14.0"
