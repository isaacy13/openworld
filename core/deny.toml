# cargo deny check --manifest-path core/Cargo.toml
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Everything must be compatible with shipping under Apache-2.0.
# CDLA-Permissive-2.0 covers webpki-roots, the Mozilla root certificates as data. It asks
# only that the license text travel with the data, which is permissive.
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0", "Unicode-3.0", "Unlicense", "CC0-1.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
