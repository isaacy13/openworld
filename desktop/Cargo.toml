# The Linux and Windows desktop app. Its own workspace, so core CI does not need GTK.
[workspace]

[package]
name = "openworld-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenWorld for Linux and Windows: libadwaita over the scan library"
publish = false

[[bin]]
name = "openworld-desktop"
path = "src/main.rs"

[dependencies]
openworld-core = { path = "../core/openworld-core", default-features = false, features = ["ort-dynamic", "fixture", "network"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
async-channel = "2.3.1"
image = { version = "0.25.5", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"

[features]
# A dev flag that drives every screen with the demo still and saves PNGs. Not in a release build.
shots = []

[dev-dependencies]
tempfile = "3.14.0"

[profile.release]
lto = "thin"
