version: 2
updates:
  # Actions are pinned to commit SHAs with the tag as a comment (scripts/pin_actions.py).
  # Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
