name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: pinned ONNX Runtime
        run: python3 scripts/fetch_ort.py
      - name: licenses and advisories
        run: cargo deny --manifest-path core/Cargo.toml check licenses bans sources advisories
      - name: clippy
        run: cargo clippy --manifest-path core/Cargo.toml -p openworld-core -p openworld-cli -- -D warnings
      - name: tests and line coverage
        run: cargo llvm-cov --manifest-path core/Cargo.toml --workspace --fail-under-lines 85
      - name: a build without the demo markers refuses demo posters
        run: cargo build --manifest-path core/Cargo.toml -p openworld-cli --no-default-features
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-cli
      - name: pipeline self-test
        run: core/target/release/openworld --bundles bundles --json selftest
      - name: demo scan
        run: core/target/release/openworld --bundles bundles demo --out "$RUNNER_TEMP/demo"
      - name: the Apple catalog of core sentences is current
        run: python3 scripts/core_strings.py core/target/release/openworld --check

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: choco install ffmpeg --no-progress -y
      - name: pinned ONNX Runtime
        run: python scripts/fetch_ort.py windows-x86_64
      - name: library tests
        run: cargo test --manifest-path core/Cargo.toml -p openworld-core --lib
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-cli
      - name: self-test and demo
        shell: bash
        run: |
          core/target/release/openworld.exe --bundles bundles --json selftest
          core/target/release/openworld.exe --bundles bundles demo --out "$RUNNER_TEMP/demo"

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgtk-4-dev libadwaita-1-dev xvfb
      - name: pinned ONNX Runtime
        run: python3 scripts/fetch_ort.py
      - name: clippy
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets --features shots -- -D warnings
      - name: view-model tests and window smoke test
        env:
          OPENWORLD_REQUIRE_DISPLAY: "1"
        run: xvfb-run -a cargo test --manifest-path desktop/Cargo.toml
      - name: every screen end to end
        run: |
          cargo build --manifest-path desktop/Cargo.toml --features shots
          xvfb-run -a -s "-screen 0 1600x1600x24" desktop/target/debug/openworld-desktop --screenshot "$RUNNER_TEMP/desktop-shots"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-shots
          path: ${{ runner.temp }}/desktop-shots

  # The GTK 4 / libadwaita app on Windows: MSYS2 UCRT64 GTK, the pinned Rust for the GNU
  # target, the pinned ONNX Runtime DLL. Runs the view-model tests (real scans of the demo
  # still through the core) and the window smoke test on the runner's desktop.
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Overrides rust-toolchain.toml, which would pick the MSVC host; GTK here is MinGW.
      RUSTUP_TOOLCHAIN: 1.97.0-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0-x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Keep the Windows PATH, so cargo from rustup and Chocolatey's ffmpeg are found.
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: choco install ffmpeg --no-progress -y
      - name: pinned ONNX Runtime
        run: python scripts/fetch_ort.py windows-x86_64
      - name: the toolchain the build uses
        shell: msys2 {0}
        run: |
          rustc -vV
          cargo -V
          which gcc pkg-config ffmpeg || true
          pkg-config --modversion gtk4 libadwaita-1
      - name: view-model tests and window smoke test
        shell: msys2 {0}
        env:
          # The UCRT64 compiler driver links against the UCRT64 GTK; first on the MSYS2 PATH.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: cargo test --manifest-path desktop/Cargo.toml

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: Fast weights, kept only when the pinned SHA-256 matches
        run: python3 scripts/fetch_weights.py fast
      - uses: gradle/actions/setup-gradle@v4
      - name: APK and JVM tests
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: openworld-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # The core this job built, so android-emulator links the same library without Rust.
      - uses: actions/upload-artifact@v4
        with:
          name: openworld-core-jnilibs
          path: android/app/src/main/jniLibs
          if-no-files-found: error

  # The instrumented tests on an x86_64 emulator: the platform's MediaCodec encoder and
  # decoder, MediaMuxer and MediaExtractor, and the core over JNI. No photos of people:
  # the tests make demo-marker stills and videos on the device.
  android-emulator:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v4
      - name: let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: openworld-core-jnilibs
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # The JNI shim is still compiled here (CMake and the NDK); the core is the android job's.
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: Fast weights, kept only when the pinned SHA-256 matches
        run: python3 scripts/fetch_weights.py fast
      - uses: gradle/actions/setup-gradle@v4
      - name: app and test APKs, before the emulator starts
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PskipRustCore --stacktrace
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-v1
      - name: an emulator snapshot for the cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "snapshot saved"
      - name: instrumented tests (demo still, encoded video, rotation, stop, truncated file)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest -PskipRustCore --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-test-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore

  apple-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-core
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: OpenWorldKit tests, including the real C API
        working-directory: apple
        env:
          OPENWORLD_LIB_DIR: ${{ github.workspace }}/core/target/release
        run: swift test

  apple:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: brew install xcodegen
      - name: core and ONNX Runtime XCFrameworks
        run: apple/scripts/build-core.sh
      - name: generate the Xcode project
        working-directory: apple
        run: xcodegen generate
      - name: iPhone app for the simulator
        working-directory: apple
        run: xcodebuild -project OpenWorld.xcodeproj -scheme OpenWorld -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Mac app, kit and decoder tests on the linked core, launch smoke test
        working-directory: apple
        run: xcodebuild -project OpenWorld.xcodeproj -scheme OpenWorldMac -destination 'platform=macOS,arch=arm64' test
      - name: the iOS simulators on this runner
        run: xcrun simctl list devices available
      - name: kit and decoder tests on an iOS simulator
        working-directory: apple
        run: |
          udid="$(python3 scripts/pick-simulator.py)"
          xcodebuild -project OpenWorld.xcodeproj -scheme OpenWorldTests -destination "id=$udid" CODE_SIGNING_ALLOWED=NO test

  real-faces:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            eval/real
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/fetch_ort.py
      - name: Fast weights, kept only when the pinned SHA-256 matches
        run: python scripts/fetch_weights.py fast
      # The archives are pinned by SHA-256 in eval/real_faces.py. Photos are never committed.
      - uses: actions/cache@v4
        with:
          # The same paths as earlier runs, so their cached archives restore.
          path: |
            ~/.cache/openworld-eval/lfw.tgz
            ~/.cache/openworld-eval/pairs.txt
            ~/.cache/openworld-eval/WIDER_val.zip
            ~/.cache/openworld-eval/wider_face_split.zip
            ~/.cache/openworld-eval/calfw
            ~/.cache/openworld-eval/cplfw
          key: public-faces-${{ hashFiles('eval/real_faces.py') }}
          restore-keys: public-faces-
      - name: statistics unit tests
        run: python -m unittest discover -s eval -p 'test_*.py'
      # The eval build writes raw scores, so it gets its own target folder.
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-cli --features eval --target-dir target-eval
      - run: cargo build --release --manifest-path eval/real/Cargo.toml
      - name: bench on this runner
        run: target-eval/release/openworld --bundles bundles --json bench
      - name: sampled real-photo check against the published Fast curve
        if: hashFiles('bundles/fast/curve.json') != ''
        run: >
          python eval/real_faces.py --bin target-eval/release/openworld
          --eval-bin eval/real/target/release/openworld-eval
          --people 300 --wider-images 500 --scan-people 30 --video-people 5 --posters 100
          --check bundles/fast/curve.json --out "$RUNNER_TEMP/sample-curve.json" > /dev/null
