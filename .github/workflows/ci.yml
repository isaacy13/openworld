name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      - name: every action is pinned to a commit SHA
        run: python3 scripts/pin_actions.py --check
      - name: script tests (pins, action pinning, release tools)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: pinned ONNX Runtime
        run: python3 scripts/fetch_ort.py
      - name: licenses and advisories
        run: cargo deny --manifest-path core/Cargo.toml check licenses bans sources advisories
      - name: clippy
        run: cargo clippy --manifest-path core/Cargo.toml -p openworld-core -p openworld-cli -- -D warnings
      - name: tests and line coverage
        run: cargo llvm-cov --manifest-path core/Cargo.toml --workspace --fail-under-lines 85
      - name: a build without the demo markers refuses demo posters
        run: cargo build --manifest-path core/Cargo.toml -p openworld-cli --no-default-features
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-cli
      - name: pipeline self-test
        run: core/target/release/openworld --bundles bundles --json selftest
      - name: demo scan
        run: core/target/release/openworld --bundles bundles demo --out "$RUNNER_TEMP/demo"
      - name: the Apple catalog of core sentences is current
        run: python3 scripts/core_strings.py core/target/release/openworld --check

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - run: choco install ffmpeg --no-progress -y
      - name: pinned ONNX Runtime
        run: python scripts/fetch_ort.py windows-x86_64
      - name: library tests
        run: cargo test --manifest-path core/Cargo.toml -p openworld-core --lib
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-cli
      - name: self-test and demo
        shell: bash
        run: |
          core/target/release/openworld.exe --bundles bundles --json selftest
          core/target/release/openworld.exe --bundles bundles demo --out "$RUNNER_TEMP/demo"

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny
      - name: licenses and advisories (the desktop workspace)
        run: cargo deny --manifest-path desktop/Cargo.toml check licenses bans sources advisories
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgtk-4-dev libadwaita-1-dev xvfb
      - name: pinned ONNX Runtime
        run: python3 scripts/fetch_ort.py
      - name: clippy
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets --features shots -- -D warnings
      - name: view-model tests and window smoke test
        env:
          OPENWORLD_REQUIRE_DISPLAY: "1"
        run: xvfb-run -a cargo test --manifest-path desktop/Cargo.toml
      - name: every screen end to end
        run: |
          cargo build --manifest-path desktop/Cargo.toml --features shots
          xvfb-run -a -s "-screen 0 1600x1600x24" desktop/target/debug/openworld-desktop --screenshot "$RUNNER_TEMP/desktop-shots"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-shots
          path: ${{ runner.temp }}/desktop-shots

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: Fast weights, kept only when the pinned SHA-256 matches
        run: python3 scripts/fetch_weights.py fast
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Checks gradle-wrapper.jar against Gradle's published wrapper checksums.
          validate-wrappers: true
      # Gradle dependency verification. The build is run once with every artifact it resolves
      # (Google Maven, Maven Central, the plugin portal) hashed by Gradle, for the debug and
      # release builds and the JVM tests, and the result must equal the committed
      # android/gradle/verification-metadata.xml. When it does not (or that file is not
      # committed yet), the job fails, prints the generated file, and uploads it as the
      # `gradle-verification-metadata` artifact for review and commit. Nobody types these hashes.
      - name: Gradle verification metadata matches what the build resolves
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          committed="$RUNNER_TEMP/verification-metadata.committed.xml"
          rm -f "$committed"
          if [ -f gradle/verification-metadata.xml ]; then cp gradle/verification-metadata.xml "$committed"; fi
          rm -f gradle/verification-metadata.xml
          ./gradlew --write-verification-metadata sha256 assembleDebug assembleRelease testDebugUnitTest --stacktrace
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/verification-metadata.xml"
          if [ ! -f "$committed" ]; then
            echo "::error::android/gradle/verification-metadata.xml is not committed. Review the generated file below (also uploaded as the gradle-verification-metadata artifact) and commit it."
            cat gradle/verification-metadata.xml
            exit 1
          fi
          if ! diff -u "$committed" gradle/verification-metadata.xml; then
            echo "::error::android/gradle/verification-metadata.xml differs from what the build resolves. Review the diff above; the generated file is the gradle-verification-metadata artifact."
            cat gradle/verification-metadata.xml
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gradle-verification-metadata
          path: ${{ runner.temp }}/verification-metadata.xml
          if-no-files-found: ignore
      - name: APK and JVM tests, with dependency verification enforced
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openworld-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  apple-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-core
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.1"
      - name: OpenWorldKit tests, including the real C API
        working-directory: apple
        env:
          OPENWORLD_LIB_DIR: ${{ github.workspace }}/core/target/release
        run: swift test

  apple:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - run: brew install xcodegen
      - name: core and ONNX Runtime XCFrameworks
        run: apple/scripts/build-core.sh
      - name: generate the Xcode project
        working-directory: apple
        run: xcodegen generate
      - name: iPhone app for the simulator
        working-directory: apple
        run: xcodebuild -project OpenWorld.xcodeproj -scheme OpenWorld -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Mac app, kit tests on the linked core, launch smoke test
        working-directory: apple
        run: xcodebuild -project OpenWorld.xcodeproj -scheme OpenWorldMac -destination 'platform=macOS,arch=arm64' test

  real-faces:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            core
            eval/real
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/fetch_ort.py
      - name: Fast weights, kept only when the pinned SHA-256 matches
        run: python scripts/fetch_weights.py fast
      # The archives are pinned by SHA-256 in eval/real_faces.py. Photos are never committed.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The same paths as earlier runs, so their cached archives restore.
          path: |
            ~/.cache/openworld-eval/lfw.tgz
            ~/.cache/openworld-eval/pairs.txt
            ~/.cache/openworld-eval/WIDER_val.zip
            ~/.cache/openworld-eval/wider_face_split.zip
            ~/.cache/openworld-eval/calfw
            ~/.cache/openworld-eval/cplfw
          key: public-faces-${{ hashFiles('eval/real_faces.py') }}
          restore-keys: public-faces-
      - name: statistics unit tests
        run: python -m unittest discover -s eval -p 'test_*.py'
      # The eval build writes raw scores, so it gets its own target folder.
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-cli --features eval --target-dir target-eval
      - run: cargo build --release --manifest-path eval/real/Cargo.toml
      - name: bench on this runner
        run: target-eval/release/openworld --bundles bundles --json bench
      - name: sampled real-photo check against the published Fast curve
        if: hashFiles('bundles/fast/curve.json') != ''
        run: >
          python eval/real_faces.py --bin target-eval/release/openworld
          --eval-bin eval/real/target/release/openworld-eval
          --people 300 --wider-images 500 --scan-people 30 --video-people 5
          --check bundles/fast/curve.json --out "$RUNNER_TEMP/sample-curve.json" > /dev/null
