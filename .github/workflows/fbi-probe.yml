name: fbi-probe
# Temporary: which User-Agent do the FBI poster photo hosts accept from a GitHub runner? Removed after it answers.
on:
  push:
    paths: [".github/workflows/fbi-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          list=$(curl -sS -A "OpenWorld/0.1.0" 'https://api.fbi.gov/wanted/v1/list?page=1&pageSize=3')
          echo "$list" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(i["url"] + " | " + str(i["images"][0]) for i in d["items"]))'
          photo=$(echo "$list" | python3 -c 'import json,sys; d=json.load(sys.stdin); im=d["items"][0]["images"][0]; print(im.get("original") or im.get("large"))')
          large=$(echo "$list" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["items"][0]["images"][0].get("large"))')
          for u in "$photo" "$large"; do
            for ua in "" "OpenWorld/0.1.0" "OpenWorld/0.1.0 (+https://github.com/isaacy13/openworld)" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"; do
              if [ -z "$ua" ]; then code=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$u"); else code=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' -A "$ua" "$u"); fi
              echo "$code  ${ua:-curl default}  $u"
              sleep 2
            done
          done
