name: measure
# The full Fast measurement. Run by hand; commit the uploaded curve as bundles/fast/curve.json.
on:
  workflow_dispatch:
  # A manual dispatch needs this file on the default branch. Until then, a change to it runs it.
  push:
    paths: [".github/workflows/measure.yml"]

permissions:
  contents: read

jobs:
  fast-curve:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            eval/real
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/fetch_ort.py
      - run: python scripts/fetch_weights.py fast
      - uses: actions/cache@v4
        with:
          # The same paths as earlier runs, so their cached archives restore.
          path: |
            ~/.cache/openworld-eval/lfw.tgz
            ~/.cache/openworld-eval/pairs.txt
            ~/.cache/openworld-eval/WIDER_val.zip
            ~/.cache/openworld-eval/wider_face_split.zip
            ~/.cache/openworld-eval/calfw
            ~/.cache/openworld-eval/cplfw
          key: public-faces-${{ hashFiles('eval/real_faces.py') }}
          restore-keys: public-faces-
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-cli --features eval --target-dir target-eval
      - run: cargo build --release --manifest-path eval/real/Cargo.toml
      - name: full measurement
        run: >
          python eval/real_faces.py --bin target-eval/release/openworld
          --eval-bin eval/real/target/release/openworld-eval
          --out "$RUNNER_TEMP/curve.json"
      - name: print the curve
        if: always()
        run: cat "$RUNNER_TEMP/curve.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-curve
          path: ${{ runner.temp }}/curve.json
