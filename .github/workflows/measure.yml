name: measure
# The full Fast measurement. Run by hand; commit the uploaded curve as bundles/fast/curve.json.
on:
  workflow_dispatch:
  # A manual dispatch needs this file on the default branch. Until then, a change to it or its script runs it.
  push:
    paths: [".github/workflows/measure.yml", "eval/real_faces.py"]

permissions:
  contents: read

jobs:
  fast-curve:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            core
            eval/real
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install numpy==2.1.3
      - run: python scripts/fetch_ort.py
      - run: python scripts/fetch_weights.py fast
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # The same paths as earlier runs, so their cached archives restore.
          path: |
            ~/.cache/openworld-eval/lfw.tgz
            ~/.cache/openworld-eval/pairs.txt
            ~/.cache/openworld-eval/WIDER_val.zip
            ~/.cache/openworld-eval/wider_face_split.zip
            ~/.cache/openworld-eval/calfw
            ~/.cache/openworld-eval/cplfw
          key: public-faces-${{ hashFiles('eval/real_faces.py') }}-${{ github.run_id }}
          restore-keys: public-faces-
      - run: cargo build --release --manifest-path core/Cargo.toml -p openworld-cli --features eval --target-dir target-eval
      - run: cargo build --release --manifest-path eval/real/Cargo.toml
      - name: full measurement
        run: >
          python eval/real_faces.py --bin target-eval/release/openworld
          --eval-bin eval/real/target/release/openworld-eval
          --out "$RUNNER_TEMP/curve.json"
      # Saved even when the run fails, so the next run does not download again.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: |
            ~/.cache/openworld-eval/lfw.tgz
            ~/.cache/openworld-eval/pairs.txt
            ~/.cache/openworld-eval/WIDER_val.zip
            ~/.cache/openworld-eval/wider_face_split.zip
            ~/.cache/openworld-eval/calfw
            ~/.cache/openworld-eval/cplfw
          key: public-faces-${{ hashFiles('eval/real_faces.py') }}-${{ github.run_id }}
      - name: print the curve
        if: always()
        run: cat "$RUNNER_TEMP/curve.json" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fast-curve
          path: ${{ runner.temp }}/curve.json
